name: Release

# Push a tag like v1.2.0 and this builds, signs and publishes the APK. Installed launchers pick it up on their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PliteVersionName="$VERSION" \
            -PliteVersionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH)) \
            -PliteStoreFile="$RUNNER_TEMP/release.jks" \
            -PliteStorePassword="$STORE_PASSWORD" \
            -PliteKeyAlias="$KEY_ALIAS" \
            -PliteKeyPassword="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "mitv-lite-launcher-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/$GITHUB_REF_NAME.md"
          [ -f "$NOTES" ] && SRC=(--notes-file "$NOTES") || SRC=(--generate-notes)
          gh release create "$GITHUB_REF_NAME" "mitv-lite-launcher-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" "${SRC[@]}"
